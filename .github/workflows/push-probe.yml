name: push-probe
on:
  workflow_dispatch:
    inputs:
      pr:
        description: Disposable pull request number
        required: true
      expected_base:
        description: Captured base commit SHA
        required: true
      expected_head:
        description: Captured PR head commit SHA
        required: true
      expected_tree:
        description: Captured resulting tree SHA
        required: true
      mode:
        description: valid, wrong_tree, wrong_parents, cancel, or discard_response
        required: true
        default: valid
      pause_seconds:
        description: Bounded pause before final push
        required: true
        default: '0'
permissions:
  contents: write
  pull-requests: read
jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ inputs.pr }}
      EXPECTED_BASE: ${{ inputs.expected_base }}
      EXPECTED_HEAD: ${{ inputs.expected_head }}
      EXPECTED_TREE: ${{ inputs.expected_tree }}
      PROBE_MODE: ${{ inputs.mode }}
      PAUSE_SECONDS: ${{ inputs.pause_seconds }}
    steps:
      - name: Construct and verify exact inert merge object
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
          [[ "$EXPECTED_BASE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_TREE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PAUSE_SECONDS" =~ ^([0-9]|[1-5][0-9])$ ]]
          case "$PROBE_MODE" in valid|wrong_tree|wrong_parents|cancel|discard_response) ;; *) exit 64 ;; esac
          git init -q --bare "$RUNNER_TEMP/trusted.git"
          cd "$RUNNER_TEMP/trusted.git"
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          gh auth setup-git
          git -c core.hooksPath=/dev/null fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/pull/$PR_NUMBER/head:refs/remotes/origin/pr-head"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_BASE"
          test "$(git rev-parse refs/remotes/origin/pr-head)" = "$EXPECTED_HEAD"
          tree="$(GIT_NO_REPLACE_OBJECTS=1 GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null git -c core.hooksPath=/dev/null merge-tree --write-tree "$EXPECTED_BASE" "$EXPECTED_HEAD")"
          if [ "$PROBE_MODE" = wrong_tree ]; then EXPECTED_TREE=0000000000000000000000000000000000000000; fi
          test "$tree" = "$EXPECTED_TREE"
          export GIT_AUTHOR_NAME='Trusted A.3 Probe' GIT_AUTHOR_EMAIL='trusted-probe@example.invalid'
          export GIT_COMMITTER_NAME='Trusted A.3 Probe' GIT_COMMITTER_EMAIL='trusted-probe@example.invalid'
          if [ "$PROBE_MODE" = wrong_parents ]; then
            merge="$(printf '%s\n' 'Disposable trusted merge' | git -c core.hooksPath=/dev/null commit-tree "$tree" -p "$EXPECTED_HEAD" -p "$EXPECTED_BASE")"
          else
            merge="$(printf '%s\n' 'Disposable trusted merge' | git -c core.hooksPath=/dev/null commit-tree "$tree" -p "$EXPECTED_BASE" -p "$EXPECTED_HEAD")"
          fi
          read -r commit first second extra <<< "$(git show -s --format='%H %P' "$merge")"
          test "$commit" = "$merge"
          test "$first" = "$EXPECTED_BASE"
          test "$second" = "$EXPECTED_HEAD"
          test -z "${extra:-}"
          test "$(git show -s --format='%T' "$merge")" = "$EXPECTED_TREE"
          printf 'Verified merge=%s base=%s head=%s tree=%s\n' "$merge" "$first" "$second" "$tree"
          if [ "$PROBE_MODE" = cancel ]; then
            echo 'Cancellation generation revoked before send; no push issued.'
            exit 0
          fi
          sleep "$PAUSE_SECONDS"
          if [ "$PROBE_MODE" = discard_response ]; then
            git -c core.hooksPath=/dev/null push --porcelain \
              --force-with-lease="refs/heads/main:$EXPECTED_BASE" \
              origin "$merge:refs/heads/main" >"$RUNNER_TEMP/push-response" 2>&1 || true
            echo 'Push response deliberately discarded; reconcile in a separate process.'
            exit 86
          fi
          git -c core.hooksPath=/dev/null push --porcelain \
            --force-with-lease="refs/heads/main:$EXPECTED_BASE" \
            origin "$merge:refs/heads/main"
