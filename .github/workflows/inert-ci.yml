name: inert-ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  inert-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Delayed inert check for stale-CI probe
        run: |
          sleep 45
          echo 'Delayed inert check passed; no candidate program was executed.'
